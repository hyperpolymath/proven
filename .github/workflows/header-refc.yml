name: Header RefC soundness
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: header-refc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  header-refc:
    name: Real Idris header ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IDRIS_REF: b6cbc25d5cd2ef2a250556266fd7b68dfc360f8b
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y chezscheme libgmp-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: idris-cache
        with:
          path: ~/.idris2
          key: header-refc-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS_REF }}
      - name: Build pinned Idris compiler and matching RefC SDK
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/idris2"
          git -C "$RUNNER_TEMP/idris2" remote add origin https://github.com/idris-lang/Idris2.git
          git -C "$RUNNER_TEMP/idris2" fetch --depth 1 origin "$IDRIS_REF"
          git -C "$RUNNER_TEMP/idris2" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/idris2" rev-parse HEAD)" = "$IDRIS_REF"
          cd "$RUNNER_TEMP/idris2"
          make bootstrap SCHEME=chezscheme
          make install
      - name: Add Idris to PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@e7d1537c378b83b8049f65dda471d87a2f7b2df2 # v1
        with:
          version: '0.15.2'
      - name: Total Idris kernel, actual ABI, exhaustive pairs and rejecting mutant
        run: bash scripts/test-header-bridge.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: header-refc-evidence
          path: build/header-evidence/
          if-no-files-found: error

