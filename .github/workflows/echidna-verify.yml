# SPDX-License-Identifier: MPL-2.0
# Verify this repository's real proofs and ABI, using the same gates as each PR.
name: ECHIDNA Proof Verification
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  theory:
    uses: ./.github/workflows/header-theory.yml
  abi:
    uses: ./.github/workflows/header-refc.yml
  trust-summary:
    name: Trust pipeline summary
    needs: [theory, abi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both real verification gates
        env:
          THEORY: ${{ needs.theory.result }}
          ABI: ${{ needs.abi.result }}
        run: |
          printf 'Proven theory replay: %s\nActual Idris2/Zig ABI: %s\n' "$THEORY" "$ABI" >> "$GITHUB_STEP_SUMMARY"
          test "$THEORY" = success
          test "$ABI" = success

