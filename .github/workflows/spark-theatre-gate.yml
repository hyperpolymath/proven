# SPDX-License-Identifier: MPL-2.0
# Estate SPARK Theatre Gate — thin caller of the reusable workflow in
# metadatastician/standards (#135 / #141). Pinned by commit SHA per the
# estate action-pinning policy. Regenerate the pin only when the reusable
# workflow is intentionally bumped.
name: SPARK Theatre Gate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  actions: read
  contents: read
jobs:
  spark-theatre-gate:
    uses: metadatastician/standards/.github/workflows/spark-theatre-gate.yml@84c2d1c1b040c9d7b8924532fa77e71e63d72c66
    with:
      paths: "."
      enforce_zero_contract: false
