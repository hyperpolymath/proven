# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@6da35965d761761c09e3779e5639012de767bb48
    secrets: inherit

