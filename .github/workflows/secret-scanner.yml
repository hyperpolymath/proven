# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    permissions:
      contents: read
      actions: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@84c2d1c1b040c9d7b8924532fa77e71e63d72c66
