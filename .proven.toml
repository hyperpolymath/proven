# Sweep 1 runs through tests/{unit,smoke,build,p2p}.sh (shell) and the Zig standalone FFI build they drive.

[languages.ignore.ada]
reason = "Thin binding over the libproven C ABI (CLAUDE.md boundary rule); its tests need the Idris-built libproven, which the umbrella cannot provision in release 0.1. Tracked in .proven/LATER.adoc for sweep 2 onwards."

[languages.ignore.agda]
reason = "Proof or specification sources checked by their own gates (header-theory.yml, echidna-verify.yml), not by a unit runner; the umbrella has no checker for this language in release 0.1. Agda moves to the proven-tests-and-benches kit check when kit-v0.1.0 is tagged."

